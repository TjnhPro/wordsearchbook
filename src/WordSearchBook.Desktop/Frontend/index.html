<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Word Search Book</title>
    <link rel="stylesheet" href="./css/tailwind.css">
    <script defer src="./js/app.js"></script>
  </head>
  <body>
    <main class="relative flex min-h-screen items-center justify-center overflow-hidden px-6 py-12">
      <div class="absolute -left-24 top-12 h-72 w-72 rounded-full bg-orange-200/60 blur-3xl"></div>
      <div class="absolute -right-20 bottom-8 h-80 w-80 rounded-full bg-sky-200/60 blur-3xl"></div>

      <section class="relative w-full max-w-3xl rounded-3xl border border-white/70 bg-white/80 p-10 shadow-2xl shadow-slate-900/10 backdrop-blur">
        <p class="mb-4 text-sm font-semibold uppercase tracking-[0.3em] text-accent">Desktop workspace</p>
        <h1 class="text-5xl font-black tracking-tight text-ink sm:text-6xl">Word Search Book</h1>
        <p class="mt-5 max-w-2xl text-lg leading-8 text-slate-600">
          A focused workspace for building printable word-search books.
        </p>

        <div class="mt-10 flex items-center gap-3 rounded-2xl border border-slate-200 bg-slate-50 px-5 py-4">
          <span class="relative flex h-3 w-3">
            <span id="status-pulse" class="absolute inline-flex h-full w-full animate-ping rounded-full bg-amber-400 opacity-75"></span>
            <span id="status-dot" class="relative inline-flex h-3 w-3 rounded-full bg-amber-500"></span>
          </span>
          <div>
            <p class="text-xs font-semibold uppercase tracking-widest text-slate-500">Desktop bridge</p>
            <p id="desktop-status" data-state="connecting" class="mt-1 font-semibold text-slate-800">Connecting…</p>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
