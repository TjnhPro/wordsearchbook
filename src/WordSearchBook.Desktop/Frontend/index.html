<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Word Search Book</title>
    <link rel="stylesheet" href="./css/tailwind.css">
    <script defer src="./js/app.js"></script>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-lockup">
          <span class="brand-mark" aria-hidden="true">WS</span>
          <span><strong class="brand-name">Word Search Book</strong><span class="brand-caption">Desktop workspace</span></span>
        </div>
        <nav class="nav-list" aria-label="Primary navigation">
          <button class="nav-item nav-item-active" type="button" data-route="books"><span class="nav-icon" aria-hidden="true">▦</span><span>Books</span></button>
          <button class="nav-item" type="button" data-route="brands"><span class="nav-icon" aria-hidden="true">◫</span><span>Brands</span></button>
          <button class="nav-item" type="button" data-route="tasks"><span class="nav-icon" aria-hidden="true">◷</span><span>Tasks</span></button>
          <button class="nav-item" type="button" data-route="settings"><span class="nav-icon" aria-hidden="true">⚙</span><span>Settings</span></button>
        </nav>
        <div class="bridge-card">
          <span id="status-dot" class="status-dot status-dot-connecting" aria-hidden="true"></span>
          <div class="min-w-0"><p class="bridge-label">Desktop bridge</p><p id="desktop-status" data-state="connecting" class="bridge-value">Connecting…</p></div>
          <span id="status-pulse" class="status-pulse" aria-hidden="true"></span>
        </div>
      </aside>
      <div class="main-column">
        <header class="topbar">
          <div><p class="topbar-kicker">Word Search Book</p><h1 id="page-title" class="topbar-title">Books</h1></div>
          <div id="global-task-status" class="task-chip" data-state="idle" role="status"><span class="task-chip-dot"></span><span>No active tasks</span></div>
        </header>
        <main id="app-content" class="content" aria-live="polite"></main>
      </div>
    </div>
  </body>
</html>
